[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slo-intraday"
version = "0.1.0"
description = "Intraday F&O research and paper trading"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
slo-intraday-paper = "slo_intraday.paper_loop:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
